<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bock">
<meta property="og:title" content="Bock – Zeit mit Freunden">
<meta property="og:description" content="Wer hat Zeit? Wer hat Bock? Wer braucht Hilfe?">
<meta property="og:image" content="icons/og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<title>Bock</title>
<meta name="description" content="Wer hat Zeit? Wer hat Bock? Wer braucht Hilfe? Demo der privaten Freundeskreis-App.">
<style>/* Bock – mobile-first design system. No framework, no web fonts (fast + GDPR-friendly). */

:root {
  --bg: #f7f4ef;
  --surface: #ffffff;
  --surface-2: #f1ede6;
  --ink: #1d1a22;
  --muted: #706a7a;
  --line: #e9e3da;
  --shadow: 0 1px 2px rgba(29, 26, 34, .04), 0 6px 22px rgba(29, 26, 34, .06);

  --time: #0f9f6e;
  --time-soft: #e2f6ed;
  --time-ink: #0a6b4b;
  --activity: #6d4aff;
  --activity-soft: #eee9ff;
  --activity-ink: #4b2fd1;
  --help: #f26b1d;
  --help-soft: #fff0e5;
  --help-ink: #b5470b;
  --danger: #e5484d;
  --error-bg: #fde8e8;
  --error-fg: #9b1c1c;

  --radius: 22px;
  --radius-sm: 14px;
  --tap: 48px;
  --nav-h: 68px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151318;
    --surface: #211e26;
    --surface-2: #2a2630;
    --ink: #f4f1f8;
    --muted: #a7a0b2;
    --line: #34303b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    --time-soft: #133429;
    --time-ink: #5fe0ad;
    --activity-soft: #282042;
    --activity-ink: #b4a3ff;
    --help-soft: #3a2416;
    --help-ink: #ffaa73;
    --error-bg: #3b1717;
    --error-fg: #ffb4b4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #151318;
    --surface: #211e26;
    --surface-2: #2a2630;
    --ink: #f4f1f8;
    --muted: #a7a0b2;
    --line: #34303b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    --time-soft: #133429;
    --time-ink: #5fe0ad;
    --activity-soft: #282042;
    --activity-ink: #b4a3ff;
    --help-soft: #3a2416;
    --help-ink: #ffaa73;
    --error-bg: #3b1717;
    --error-fg: #ffb4b4;
    color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-size: 16px;
  line-height: 1.4;
  overscroll-behavior-y: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }

.view {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  padding: calc(var(--safe-t) + 8px) 16px calc(var(--nav-h) + var(--safe-b) + 28px);
}
.view.no-nav { padding-bottom: calc(var(--safe-b) + 110px); }

.splash { min-height: 80dvh; display: grid; place-items: center; }
.splash-logo { font-size: 64px; animation: pop 1s ease-in-out infinite alternate; }
@keyframes pop { from { transform: scale(.9) rotate(-8deg); } to { transform: scale(1.05) rotate(8deg); } }

/* ---------- Header ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0 6px;
  min-height: 56px;
}
.topbar h1 { font-size: 26px; line-height: 1.1; margin: 0; letter-spacing: -.02em; flex: 1; }
.topbar .sub { color: var(--muted); font-size: 14px; margin-top: 2px; font-weight: 500; }
.topbar .title-wrap { flex: 1; min-width: 0; }
.topbar.compact h1 { font-size: 20px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  display: inline-grid; place-items: center;
  border: 0; background: var(--surface); box-shadow: var(--shadow);
  font-size: 20px; position: relative; flex: none; text-decoration: none;
}
.icon-btn.plain { background: transparent; box-shadow: none; }
.badge-dot {
  position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 800;
  display: grid; place-items: center; border: 2px solid var(--bg);
}

/* ---------- Quick actions ---------- */
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 18px; }
.quick button {
  border: 0; border-radius: 20px; padding: 14px 6px 12px; min-height: 86px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  font-weight: 750; font-size: 14px; line-height: 1.15;
  transition: transform .12s ease;
}
.quick button:active { transform: scale(.96); }
.quick .q-emoji { font-size: 26px; line-height: 1; }
.quick .time { background: var(--time-soft); color: var(--time-ink); }
.quick .activity { background: var(--activity-soft); color: var(--activity-ink); }
.quick .help { background: var(--help-soft); color: var(--help-ink); }

/* ---------- Chips / filters ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 0 14px; height: 38px; font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.tone-time.on { background: var(--time); border-color: var(--time); color: #fff; }
.chip.tone-activity.on { background: var(--activity); border-color: var(--activity); color: #fff; }
.chip.tone-help.on { background: var(--help); border-color: var(--help); color: #fff; }
.chip.small { height: 30px; padding: 0 10px; font-size: 13px; }

/* ---------- Day sections ---------- */
.day-head {
  display: flex; align-items: baseline; gap: 8px;
  margin: 22px 4px 10px; font-weight: 800; font-size: 15px;
}
.day-head .muted { font-weight: 500; font-size: 13px; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 12px; position: relative; overflow: hidden;
  cursor: pointer;
}
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tone); }
.tone-time { --tone: var(--time); --tone-soft: var(--time-soft); --tone-ink: var(--time-ink); }
.tone-activity { --tone: var(--activity); --tone-soft: var(--activity-soft); --tone-ink: var(--activity-ink); }
.tone-help { --tone: var(--help); --tone-soft: var(--help-soft); --tone-ink: var(--help-ink); }

.kicker {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase;
  color: var(--tone-ink); background: var(--tone-soft); padding: 4px 9px; border-radius: 999px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-groups { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-title { display: flex; gap: 12px; align-items: flex-start; }
.card-emoji {
  flex: none; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center;
  font-size: 26px; background: var(--tone-soft);
}
.card-title h3 { margin: 0; font-size: 19px; line-height: 1.2; letter-spacing: -.01em; }
.card-meta { color: var(--muted); font-size: 14px; margin-top: 3px; font-weight: 500; }
.card-meta strong { color: var(--ink); font-weight: 700; }
.card-desc { margin: 10px 0 0; font-size: 15px; }
.card-loc { margin-top: 6px; font-size: 14px; color: var(--muted); }
.card-foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.card-foot .spacer { flex: 1; }
.comment-count { color: var(--muted); font-size: 14px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; padding: 0 4px; }

.people { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; color: var(--muted); }
.people strong { color: var(--ink); font-weight: 650; }

.progress { margin-top: 12px; }
.progress-bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress-bar > span { display: block; height: 100%; background: var(--tone); border-radius: 99px; transition: width .3s; }
.progress-label { font-size: 13px; color: var(--muted); margin-top: 6px; font-weight: 600; }
.progress-label.done { color: var(--tone-ink); }

.ideas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.idea { background: var(--tone-soft); color: var(--tone-ink); font-size: 13px; font-weight: 650; border-radius: 999px; padding: 5px 10px; }

/* ---------- Avatars ---------- */
.avatar {
  --size: 32px;
  width: var(--size); height: var(--size); border-radius: 50%; flex: none;
  display: inline-grid; place-items: center; font-size: calc(var(--size) * .52); font-weight: 800; color: #fff;
  background: var(--c, #999); box-shadow: 0 0 0 2px var(--surface);
}
.avatar.lg { --size: 84px; }
.avatar.md { --size: 40px; }
.avatar.sm { --size: 26px; }
.avatar-stack { display: inline-flex; }
.avatar-stack .avatar + .avatar { margin-left: -8px; }

/* ---------- Buttons ---------- */
.btn {
  border: 0; border-radius: 16px; min-height: var(--tap); padding: 0 18px;
  font-weight: 750; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--tone, var(--ink)); color: #fff; text-decoration: none;
  transition: transform .1s ease, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; }
.btn.block { width: 100%; }
.btn.soft { background: var(--tone-soft, var(--surface-2)); color: var(--tone-ink, var(--ink)); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.whatsapp { background: #25d366; color: #fff; }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid var(--line); }
.btn.sm { min-height: 40px; font-size: 14px; padding: 0 14px; border-radius: 13px; }
.btn.lg { min-height: 56px; font-size: 17px; border-radius: 18px; }

/* ---------- Tabbar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; font-weight: 650; color: var(--muted); text-decoration: none; height: 100%; justify-content: center;
  position: relative;
}
.tab .t-icon { font-size: 22px; line-height: 1; filter: grayscale(1); opacity: .7; }
.tab.on { color: var(--ink); }
.tab.on .t-icon { filter: none; opacity: 1; }
.tab-plus { display: grid; place-items: center; }
.tab-plus button {
  width: 60px; height: 60px; border-radius: 22px; border: 0; margin-top: -26px;
  background: conic-gradient(from 210deg, var(--time), var(--activity), var(--help), var(--time));
  color: #fff; font-size: 34px; font-weight: 400; line-height: 1;
  box-shadow: 0 8px 22px rgba(109, 74, 255, .35); display: grid; place-items: center;
  transition: transform .12s ease;
}
.tab-plus button:active { transform: scale(.92) rotate(90deg); }

/* ---------- Sheet ---------- */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(15, 12, 20, .45); z-index: 40;
  animation: fade .18s ease;
}
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92dvh; overflow-y: auto;
  background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 16px calc(var(--safe-b) + 20px);
  max-width: 560px; margin: 0 auto; animation: up .24s cubic-bezier(.2, .9, .3, 1.1);
}
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet h2 { margin: 4px 4px 16px; font-size: 22px; letter-spacing: -.01em; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.choice {
  display: flex; align-items: center; gap: 14px; width: 100%;
  border: 0; border-radius: 20px; padding: 16px; margin-bottom: 10px; text-align: left;
  background: var(--tone-soft); color: var(--tone-ink);
}
.choice .c-emoji { font-size: 30px; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); flex: none; }
.choice strong { display: block; font-size: 18px; color: var(--ink); }
.choice span { font-size: 14px; }

/* ---------- Forms ---------- */
.form { display: flex; flex-direction: column; gap: 18px; }
.field label, .label { display: block; font-size: 13px; font-weight: 750; color: var(--muted); margin: 0 4px 8px; text-transform: uppercase; letter-spacing: .05em; }
.input, .textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-sm);
  min-height: 52px; padding: 12px 14px; font-size: 17px; outline: none;
}
.input:focus, .textarea:focus { border-color: var(--tone, var(--activity)); }
.input.big { font-size: 21px; font-weight: 650; min-height: 60px; }
.textarea { min-height: 84px; resize: vertical; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { flex: 1; min-width: 0; }
.time-input { text-align: center; font-weight: 700; }
.row .sep { flex: none; color: var(--muted); font-weight: 700; }
.hint { font-size: 13px; color: var(--muted); margin: 6px 4px 0; }
.parsed {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 13px; font-weight: 650;
  color: var(--tone-ink); animation: fade .2s;
}
.parsed span { background: var(--tone-soft); border-radius: 999px; padding: 4px 10px; }
.link-btn { background: none; border: 0; padding: 8px 4px; font-weight: 700; color: var(--tone-ink, var(--activity-ink)); font-size: 15px; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 16px; padding: 4px; gap: 4px; }
.segmented button { border: 0; background: transparent; border-radius: 12px; min-height: 46px; font-weight: 700; font-size: 15px; color: var(--muted); }
.segmented button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 4px; }
.stepper button { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--surface-2); font-size: 22px; font-weight: 700; }
.stepper output { min-width: 44px; text-align: center; font-size: 20px; font-weight: 800; }
.sticky-cta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  padding: 12px 16px calc(var(--safe-b) + 12px);
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.sticky-cta > * { max-width: 528px; margin: 0 auto; display: flex; }
.error-box { background: var(--error-bg); color: var(--error-fg); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 600; }

/* ---------- Detail ---------- */
.hero { background: var(--tone-soft); border-radius: 28px; padding: 22px 18px 20px; margin-top: 4px; }
.hero .emoji { font-size: 54px; line-height: 1; margin: 12px 0 10px; }
.hero h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.12; letter-spacing: -.02em; }
.hero .when { font-size: 18px; font-weight: 800; }
.hero .meta-line { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 15px; }
.hero .meta-line a { text-decoration: none; color: var(--tone-ink); font-weight: 650; }
.hero .desc { margin: 14px 0 0; font-size: 16px; }
.actions { display: flex; gap: 8px; margin: 16px 0 4px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 0; min-width: 0; }
.status-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 4px; }
.status-row .btn { padding: 0 6px; font-size: 15px; }
.status-row .btn:not(.on) { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.status-row .btn.on { background: var(--tone); color: #fff; }

.section { margin-top: 26px; }
.section-title { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin: 0 4px 10px; display: flex; justify-content: space-between; }
.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; text-decoration: none; }
.list-item + .list-item { border-top: 1px solid var(--line); }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .title { font-weight: 700; }
.list-item .sub { color: var(--muted); font-size: 13px; }
.tag { font-size: 12px; font-weight: 750; border-radius: 999px; padding: 3px 9px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.yes { background: var(--tone-soft); color: var(--tone-ink); }

.comment { display: flex; gap: 10px; margin-bottom: 14px; }
.bubble { background: var(--surface); border-radius: 6px 18px 18px 18px; padding: 9px 13px; box-shadow: var(--shadow); max-width: 100%; }
.bubble .who { font-size: 13px; font-weight: 750; }
.bubble .who .muted { font-weight: 500; }
.bubble p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.suggestion { background: var(--tone-soft); border: 1.5px dashed var(--tone); }
.composer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  padding: 10px 12px calc(var(--safe-b) + 10px); background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
}
.composer form { max-width: 536px; margin: 0 auto; display: flex; gap: 8px; }
.composer .input { min-height: 48px; border-radius: 24px; font-size: 16px; }
.composer button { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--tone, var(--ink)); color: #fff; font-size: 20px; flex: none; }

.banner {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin: 12px 0;
  border: 2px solid var(--tone);
}
.banner h3 { margin: 0 0 4px; font-size: 18px; }
.banner p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }

/* ---------- Week ---------- */
.week-nav { display: flex; align-items: center; gap: 8px; margin: 6px 0 12px; }
.week-nav .range { flex: 1; text-align: center; font-weight: 800; }
.week-day { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.week-day.today .wd-label { background: var(--ink); color: var(--bg); }
.wd-label { border-radius: 16px; text-align: center; padding: 6px 0; align-self: start; background: var(--surface); box-shadow: var(--shadow); }
.wd-label .wd { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }
.wd-label .dn { font-size: 20px; font-weight: 850; line-height: 1.1; }
.week-items { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.w-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; text-decoration: none;
  background: var(--tone-soft); border-left: 4px solid var(--tone); min-height: 48px;
}
.w-item .w-time { font-size: 13px; font-weight: 800; color: var(--tone-ink); min-width: 42px; }
.w-item .w-main { flex: 1; min-width: 0; }
.w-item .w-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-item .w-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-item.mine { box-shadow: inset 0 0 0 2px var(--tone); }
.w-empty { color: var(--muted); font-size: 14px; padding: 12px 4px; display: flex; justify-content: space-between; align-items: center; }
.w-empty a { color: var(--time-ink); font-weight: 700; text-decoration: none; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 4px 4px 0; font-weight: 600; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--tone); margin-right: 5px; vertical-align: -1px; }

/* ---------- Groups / profile ---------- */
.group-card { display: flex; align-items: center; gap: 14px; }
.group-emoji { width: 56px; height: 56px; border-radius: 18px; background: var(--surface-2); display: grid; place-items: center; font-size: 30px; flex: none; }
.group-card .grow { flex: 1; min-width: 0; }
.group-card h3 { margin: 0 0 4px; font-size: 18px; }
.card.plain::before { display: none; }
.emoji-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.emoji-pick button { width: 48px; height: 48px; border-radius: 14px; border: 2px solid transparent; background: var(--surface); font-size: 24px; }
.emoji-pick button.on { border-color: var(--ink); }
.color-pick { display: flex; gap: 10px; flex-wrap: wrap; }
.color-pick button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; background: var(--c); }
.color-pick button.on { border-color: var(--ink); }
.profile-head { text-align: center; padding: 18px 0 8px; }
.profile-head h1 { margin: 12px 0 2px; font-size: 26px; }

/* ---------- Auth / welcome ---------- */
.welcome { padding-top: 6dvh; }
.logo-big { font-size: 64px; line-height: 1; }
.welcome h1 { font-size: 40px; margin: 12px 0 8px; letter-spacing: -.03em; }
.welcome .tagline { font-size: 19px; color: var(--muted); margin: 0 0 24px; line-height: 1.35; }
.pillars { display: grid; gap: 10px; margin: 0 0 28px; }
.pillar { display: flex; align-items: center; gap: 12px; background: var(--tone-soft); color: var(--tone-ink); border-radius: 18px; padding: 12px 14px; font-weight: 700; }
.pillar .p-emoji { font-size: 24px; }
.demo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.demo-grid button { border: 0; background: var(--surface); border-radius: 18px; padding: 12px 4px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 26px 0 18px; font-weight: 600; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---------- Misc ---------- */
.muted { color: var(--muted); }
.center { text-align: center; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty .e-emoji { font-size: 48px; margin-bottom: 8px; }
.empty h3 { color: var(--ink); margin: 0 0 6px; }
.toast-wrap { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b) + 14px); z-index: 60; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
.toast { background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 16px; font-weight: 650; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.2); display: flex; gap: 12px; align-items: center; pointer-events: auto; animation: up .2s ease; }
.toast button { background: none; border: 0; color: var(--bg); font-weight: 800; text-decoration: underline; padding: 4px; }
.notif { display: flex; gap: 12px; padding: 14px; align-items: flex-start; text-decoration: none; }
.notif + .notif { border-top: 1px solid var(--line); }
.notif.unread { background: color-mix(in srgb, var(--activity-soft) 60%, transparent); }
.notif .n-text { flex: 1; font-size: 15px; }
.notif .n-time { font-size: 12px; color: var(--muted); margin-top: 2px; }
.install-tip { background: var(--surface); border-radius: 18px; padding: 14px; font-size: 14px; color: var(--muted); box-shadow: var(--shadow); }
.share-preview { background: var(--surface-2); border-radius: 16px; padding: 12px 14px; font-size: 14px; white-space: pre-wrap; margin-bottom: 14px; color: var(--ink); }
.stack > * + * { margin-top: 10px; }
